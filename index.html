/* Staffelt den Eintritt einer Liste. Die Verzögerung selbst folgt einer
   Ease-Out-Kurve statt eines starren i*step-Rasters — die Abstände sind am
   Anfang größer und werden zum Ende hin enger, die Elemente "landen"
   gemeinsam statt im starren Metronom-Takt anzukommen. */
function applyStagger(container, step=50){
  if(!container) return;
  const kids = Array.from(container.children);
  const n = Math.max(1, kids.length-1);
  kids.forEach((child,i)=>{
    const eased = 1 - Math.pow(1 - i/n, 2); // ease-out quad auf den Index selbst
    child.classList.add('stagger-item');
    child.style.animationDelay = Math.round(eased*step*kids.length*0.6)+'ms';
  });
}

/* Magnetismus: das Element folgt dem Cursor minimal (max. 5px), federt beim
   Verlassen sanft zurück. Bewusst nur auf wenigen, großen, wichtigen
   Elementen — nicht überall, sonst wirkt es unruhig statt hochwertig. */
function applyMagneticHover(selector, strength=6){
  document.querySelectorAll(selector).forEach(el=>{
    if(el.dataset.magnetic) return;
    el.dataset.magnetic = '1';
    el.addEventListener('mousemove', e=>{
      const r = el.getBoundingClientRect();
      const x = ((e.clientX - r.left)/r.width - 0.5) * strength;
      const y = ((e.clientY - r.top)/r.height - 0.5) * strength;
      el.style.setProperty('--mx', x.toFixed(2)+'px');
      el.style.setProperty('--my', y.toFixed(2)+'px');
    });
    el.addEventListener('mouseleave', ()=>{
      el.style.setProperty('--mx', '0px');
      el.style.setProperty('--my', '0px');
    });
  });
}

function paintModule(key){
  const mod = findModule(key);
  const el = document.getElementById('modList'); if(!el) return;
  let items = entitiesOf(key);

  if(mod.mode==='finance'){
    const total = items.reduce((s,f)=>s+f.amount,0);
    document.getElementById('modSummary').innerHTML = `<div class="stat-card"><div class="num" style="color:${total>=0?'var(--success)':'var(--danger)'}">${total>=0?'+':''}${total.toFixed(2)} CHF</div><div class="lbl">Saldo</div></div>`;
    items = [...items].reverse();
  }
  if(mod.mode==='date'){
    items = [...items].sort((a,b)=>new Date(a.date)-new Date(b.date));
  }

  if(!items.length){ el.innerHTML = emptyState(mod.icon, 'Noch nichts erfasst.'); return; }

  el.innerHTML = (mod.mode==='date' && mod.grouped)
    ? renderGroupedDates(items)
    : items.map(it=>renderModRow(mod, it)).join('');

  wireModRows(el, key);
  applyStagger(el);
}

function renderModRow(mod, it){
  switch(mod.mode){
    case 'checklist':
      return `<div class="row-item"><span class="check ${it.done?'on':''}" data-id="${it.id}" data-act="toggle"></span><span class="rtxt ${it.done?'done':''}">${esc(it.title)}</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    case 'habit': {
      const today = todayStr(); const checkedToday = (it.checked||[]).includes(today); const streak = computeStreak(it);
      return `<div class="row-item"><span class="check ${checkedToday?'on':''}" data-id="${it.id}" data-act="togglehabit"></span><span class="rtxt">${esc(it.title)}</span><span class="rmeta mono">${streak>0?'🔥 '+streak:'—'}</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    }
    case 'progress':
      return `<div class="row-item"><span class="rtxt">${esc(it.title)}</span><div class="progress-track" style="width:70px;"><div class="progress-fill" style="width:${it.progress}%"></div></div><input type="number" min="0" max="100" value="${it.progress}" data-id="${it.id}" data-act="prog" style="width:48px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 5px; font-size:11px;"><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    case 'status': {
      const col = STATUS_COLOR[it.status];
      return `<div class="row-item"><span class="rtxt">${esc(it.title)}</span><span class="status-pill" style="color:${col[0]}; background:${col[1]}; cursor:pointer;" data-id="${it.id}" data-act="cyclestatus">${it.status}</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    }
    case 'date':
      return `<div class="row-item"><span class="rtxt">${esc(it.title)}</span><span class="rmeta mono">${it.date?fmtDate(it.date):'—'}</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    case 'finance':
      return `<div class="row-item"><span class="rtxt">${esc(it.title)}</span><span class="rmeta mono" style="color:${it.amount>=0?'var(--success)':'var(--danger)'}">${it.amount>=0?'+':''}${it.amount.toFixed(2)} CHF</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
    default: // 'note'
      return `<div class="row-item"><span class="rtxt">${esc(it.title)}</span><button class="row-del" data-id="${it.id}" data-act="del">${svg('trash')}</button></div>`;
  }
}

function renderGroupedDates(items){
  const now = new Date(); const in7 = new Date(); in7.setDate(now.getDate()+7);
  const groups = {'Heute':[], 'Diese Woche':[], 'Später':[]};
  items.forEach(ev=>{
    const d = new Date(ev.date);
    if(d.toDateString()===now.toDateString()) groups['Heute'].push(ev);
    else if(d<=in7) groups['Diese Woche'].push(ev);
    else groups['Später'].push(ev);
  });
  return Object.entries(groups).filter(([,v])=>v.length).map(([label,its])=>`
    <div class="section-eyebrow">${label}</div>
    ${its.map(ev=>renderModRow({mode:'date'}, ev)).join('')}
  `).join('');
}

function wireModRows(el, key){
  el.querySelectorAll('[data-act="del"]').forEach(x=>x.addEventListener('click', ()=>{
    if(!confirmedDelete(x.dataset.id)) return;
    paintModule(key);
  }));
  el.querySelectorAll('[data-act="toggle"]').forEach(x=>x.addEventListener('click', ()=>{
    const it = findEntity(x.dataset.id); const done = !it.done;
    updateEntity(it.id, { done, completedAt: done ? Date.now() : null });
    paintModule(key);
  }));
  el.querySelectorAll('[data-act="togglehabit"]').forEach(x=>x.addEventListener('click', ()=>{
    const it = findEntity(x.dataset.id); const today = todayStr();
    const checked = (it.checked||[]).slice(); const idx = checked.indexOf(today);
    if(idx>=0) checked.splice(idx,1); else checked.push(today);
    updateEntity(it.id, {checked}); paintModule(key);
  }));
  el.querySelectorAll('[data-act="prog"]').forEach(x=>x.addEventListener('change', ()=>{
    updateEntity(x.dataset.id, {progress: Math.max(0,Math.min(100, parseInt(x.value)||0))}); paintModule(key);
  }));
  el.querySelectorAll('[data-act="cyclestatus"]').forEach(x=>x.addEventListener('click', ()=>{
    const it = findEntity(x.dataset.id);
    updateEntity(it.id, {status: STATUS_CYCLE[(STATUS_CYCLE.indexOf(it.status)+1)%STATUS_CYCLE.length]});
    paintModule(key);
  }));
}

function addModuleItem(key){
  const mod = findModule(key);
  const titleEl = document.getElementById('modTitle'); const v = titleEl.value.trim(); if(!v) return;
  let fields = {type:key, title:v};
  if(mod.mode==='progress') fields.progress = 0;
  if(mod.mode==='status') fields.status = 'Aktiv';
  if(mod.mode==='checklist') fields.done = false;
  if(mod.mode==='habit') fields.checked = [];
  if(mod.mode==='date'){ const extra = document.getElementById('modExtra'); fields.date = extra.value || null; extra.value=''; }
  if(mod.mode==='finance'){
    const amt = document.getElementById('modAmount'); const sign = parseFloat(document.getElementById('modFinType').value);
    if(!amt.value){ return; }
    fields.amount = Math.abs(parseFloat(amt.value))*sign; amt.value='';
  }
  createEntity(key, fields);
  titleEl.value=''; paintModule(key); toast('Hinzugefügt');
}

/* ============ MODUL-EINSTELLUNGEN (z.B. Tagesziele) ============
   Ziele/Ziele-ähnliche Werte sind Konfiguration, kein Inhalt — sie leben
   deshalb im ohnehin schon persistierten state.settings statt als eigene
   Entity. Namensraum pro Modul, damit sich zwei Module nie überschreiben. */
function getModuleSetting(moduleKey, field, fallback){
  const ns = (state.settings.moduleTargets||{})[moduleKey];
  return ns && ns[field]!==undefined ? ns[field] : fallback;
}
function setModuleSetting(moduleKey, field, value){
  if(!state.settings.moduleTargets) state.settings.moduleTargets = {};
  if(!state.settings.moduleTargets[moduleKey]) state.settings.moduleTargets[moduleKey] = {};
  state.settings.moduleTargets[moduleKey][field] = value;
  safeSet('aria-settings', state.settings);
}

/* ============ MULTILOG-MODUS (Struktur-Grundlage 1) ============
   Mehrere Einträge pro Tag, die sich zu einer Tagessumme aufaddieren
   (z.B. Mahlzeiten → Tageskalorien). Ein Modul definiert nur:
     fields: [{field,label,unit?}]   — welche Zahlenspalten es gibt
     entryLabel                       — Platzhaltertext fürs Namensfeld
   und bekommt Erfassung, Tagessumme, Zielabgleich UND (über
   genericMultilogTrend/-Score in der Analytics-Engine) Trends gratis dazu. */
function renderMultilogModule(mod){
  document.getElementById('panelBody').innerHTML = `
    <div class="add-row">
      <input id="mlName" placeholder="${mod.entryLabel || 'Eintrag…'}" style="flex:1.3;">
      ${mod.fields.map(f=>`<input type="number" id="mlField-${f.field}" placeholder="${f.label}" style="width:64px;">`).join('')}
      <button class="add-btn" id="mlAddBtn">${svg('plus')}</button>
    </div>
    <div class="section-eyebrow">Heute</div>
    <div id="mlTotals"></div>
    <div id="mlList"></div>
  `;
  document.getElementById('mlAddBtn').addEventListener('click', ()=>addMultilogEntry(mod));
  document.getElementById('mlName').addEventListener('keydown', e=>{ if(e.key==='Enter') addMultilogEntry(mod); });
  paintMultilog(mod);
}
function paintMultilog(mod){
  const today = todayStr();
  const entries = entitiesOf(mod.key).filter(e=>e.date===today);

  const totalsEl = document.getElementById('mlTotals');
  if(totalsEl){
    totalsEl.innerHTML = mod.fields.map(f=>{
      const sum = entries.reduce((s,e)=>s+(e[f.field]||0),0);
      const target = getModuleSetting(mod.key, f.field, null);
      const pct = target ? Math.min(100, Math.round(sum/target*100)) : null;
      return `<div class="field-row">
        <span class="field-name">${f.label}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct===null?0:pct}%"></div></div>
        <span class="field-num mono">${Math.round(sum*10)/10}${target?` / ${target}`:''}${f.unit||''}</span>
      </div>`;
    }).join('') + `<div class="field-target-row">${mod.fields.map(f=>
        `<input type="number" class="target-input" data-field="${f.field}" placeholder="Ziel ${f.label}" value="${getModuleSetting(mod.key,f.field,'')}">`
      ).join('')}</div>`;
    totalsEl.querySelectorAll('.target-input').forEach(inp=>{
      inp.addEventListener('change', ()=>{ setModuleSetting(mod.key, inp.dataset.field, parseFloat(inp.value)||null); paintMultilog(mod); });
    });
  }

  const listEl = document.getElementById('mlList');
  listEl.innerHTML = entries.length ? entries.map(e=>`
    <div class="row-item"><span class="rtxt">${esc(e.title)}</span>
      <span class="rmeta mono">${mod.fields.map(f=>`${e[f.field]||0}${f.unit||''}`).join(' · ')}</span>
      <button class="row-del" data-id="${e.id}" data-act="delml">${svg('trash')}</button></div>
  `).join('') : emptyState(mod.icon, 'Heute noch nichts erfasst.');
  listEl.querySelectorAll('[data-act="delml"]').forEach(x=>x.addEventListener('click', ()=>{
    if(!confirmedDelete(x.dataset.id)) return; paintMultilog(mod);
  }));
}
function addMultilogEntry(mod){
  const nameEl = document.getElementById('mlName'); const name = nameEl.value.trim(); if(!name) return;
  let fields = { type:'entry', title:name, date: todayStr() };
  mod.fields.forEach(f=>{ fields[f.field] = parseFloat(document.getElementById('mlField-'+f.field).value) || 0; });
  createEntity(mod.key, fields);
  nameEl.value=''; mod.fields.forEach(f=>{ document.getElementById('mlField-'+f.field).value=''; });
  paintMultilog(mod); toast('Erfasst');
}

/* ============ SESSION-MODUS (Struktur-Grundlage 2) ============
   Ein Eintrag ist keine einzelne Zahl, sondern eine benannte Liste von
   Übungen mit Sätzen — die eigentliche neue DatenFORM. Die generische
   Erfassung hier deckt den einfachen Fall ab (schnell eine Session mit
   Titel anlegen); die volle Mehrfach-Übungen-Erfassung mit Sets/Reps/
   Gewicht kommt als eigene, modul-spezifische UI mit dem Fitness Hub. */
function renderSessionModule(mod){
  document.getElementById('panelBody').innerHTML = `
    <div class="add-row">
      <input id="sessTitle" placeholder="${mod.placeholder || 'Neue Session…'}" style="flex:1.3;">
      <input id="sessDate" type="date" value="${todayStr()}">
      <button class="add-btn" id="sessAddBtn">${svg('plus')}</button>
    </div>
    <div id="sessList"></div>
  `;
  document.getElementById('sessAddBtn').addEventListener('click', ()=>addSessionEntry(mod));
  paintSessions(mod);
}
function sessionVolume(session){
  return (session.exercises||[]).reduce((total,ex)=>
    total + (ex.sets||[]).reduce((s,set)=>s+(set.reps||0)*(set.weight||0), 0), 0);
}
function paintSessions(mod){
  const el = document.getElementById('sessList');
  const sessions = [...entitiesOf(mod.key)].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!sessions.length){ el.innerHTML = emptyState(mod.icon, 'Noch keine Session erfasst.'); return; }
  el.innerHTML = sessions.map(s=>{
    const exCount = (s.exercises||[]).length;
    const volume = sessionVolume(s);
    return `<div class="row-item"><span class="rtxt">${esc(s.title)}</span>
      <span class="rmeta mono">${exCount ? `${exCount} Übung(en)${volume?`, ${Math.round(volume)} kg Volumen`:''}` : 'Noch keine Übungen'}</span>
      <span class="rmeta mono">${fmtDate(s.date)}</span>
      <button class="row-del" data-id="${s.id}" data-act="delsess">${svg('trash')}</button></div>`;
  }).join('');
  el.querySelectorAll('[data-act="delsess"]').forEach(x=>x.addEventListener('click', ()=>{
    if(!confirmedDelete(x.dataset.id)) return; paintSessions(mod);
  }));
}
function addSessionEntry(mod){
  const titleEl = document.getElementById('sessTitle'); const v = titleEl.value.trim(); if(!v) return;
  const date = document.getElementById('sessDate').value || todayStr();
  createEntity(mod.key, { type:'session', title:v, date, exercises:[] });
  titleEl.value=''; paintSessions(mod); toast('Session angelegt');
}

/* ============ FITNESS HUB ============
   Erstes "Premium-Modul": ein Nav-Eintrag, drei interne Tabs, zwei
   Registry-Einträge dahinter (fitness = Sessions, fitness_body = versteckte
   Körpermaße). Nichts hier dupliziert Werte — Volumen, PRs und stärkste
   Übungen werden bei jedem Öffnen aus den Sessions neu berechnet, damit eine
   nachträgliche Korrektur einer alten Session nie zu falschen Kennzahlen
   führen kann (siehe computeFitnessStats). */
const WORKOUT_TYPES = ['Push Day','Pull Day','Legs','Full Body','Cardio','Sonstiges'];
let fitnessTab = 'training';
let workoutDraft = freshWorkoutDraft();
function freshWorkoutDraft(){ return { title:'', date: todayStr(), workoutType: WORKOUT_TYPES[0], notes:'', exercises:[{name:'', sets:[{reps:'',weight:''}]}] }; }

function renderFitnessHub(){
  const tabs = [['training','Training'],['fortschritt','Fortschritt'],['koerper','Körper']]
    .map(([key,label])=>`<button class="period-tab ${fitnessTab===key?'active':''}" data-fittab="${key}">${label}</button>`).join('');
  document.getElementById('panelBody').innerHTML = `
    ${moduleIntroHTML('fitness')}
    <div class="period-tabs">${tabs}</div>
    <div id="fitnessTabBody"></div>
  `;
  document.querySelectorAll('[data-fittab]').forEach(btn=>btn.addEventListener('click', ()=>{
    fitnessTab = btn.dataset.fittab; renderFitnessHub();
  }));
  const body = document.getElementById('fitnessTabBody');
  if(fitnessTab==='training') renderFitnessTraining(body);
  else if(fitnessTab==='fortschritt') renderFitnessProgress(body);
  else renderFitnessBody(body);
}

/* ---- Tab: Training (Sessions ansehen + neue Session bauen) ---- */
/* ---- Pausen-Timer ----
   State lebt außerhalb der Render-Funktion, damit ein laufender Timer einen
   Re-Render der Trainings-Tab (z.B. nach dem Speichern eines Workouts)
   übersteht — die Uhrzeit läuft weiter, nur die DOM-Bindung wird erneuert. */
let restTimerRemaining = 90;
let restTimerPreset = 90;
let restTimerRunning = false;
let restTimerInterval = null;
function formatTimer(sec){
  const m = Math.floor(Math.max(0,sec)/60), s = Math.max(0,sec)%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function wireRestTimer(container){
  container.querySelectorAll('.rt-preset').forEach(btn=>btn.addEventListener('click', ()=>{
    stopRestTimer(container);
    restTimerPreset = parseInt(btn.dataset.secs);
    restTimerRemaining = restTimerPreset;
    container.querySelectorAll('.rt-preset').forEach(b=>b.classList.toggle('active', b===btn));
    container.querySelector('#rtDisplay').textContent = formatTimer(restTimerRemaining);
  }));
  container.querySelector('#rtStartBtn').addEventListener('click', ()=>{
    restTimerRunning ? stopRestTimer(container) : startRestTimer(container);
  });
  container.querySelector('#rtResetBtn').addEventListener('click', ()=>{
    stopRestTimer(container);
    restTimerRemaining = restTimerPreset;
    container.querySelector('#rtDisplay').textContent = formatTimer(restTimerRemaining);
  });
}
function startRestTimer(container){
  restTimerRunning = true;
  const startBtn = container.querySelector('#rtStartBtn'); if(startBtn) startBtn.textContent = 'Pause';
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(()=>{
    restTimerRemaining--;
    const disp = container.querySelector('#rtDisplay');
    if(disp) disp.textContent = formatTimer(restTimerRemaining);
    if(restTimerRemaining<=0){
      stopRestTimer(container);
      const box = container.querySelector('#restTimer');
      if(box){ box.classList.add('rt-done'); setTimeout(()=>box.classList.remove('rt-done'), 1400); }
      toast('Pause vorbei');
      if(state.settings.sound) speakText('Pause vorbei.');
      restTimerRemaining = restTimerPreset;
      if(disp) disp.textContent = formatTimer(restTimerRemaining);
    }
  }, 1000);
}
function stopRestTimer(container){
  restTimerRunning = false;
  if(restTimerInterval){ clearInterval(restTimerInterval); restTimerInterval = null; }
  const startBtn = container && container.querySelector('#rtStartBtn'); if(startBtn) startBtn.textContent = 'Start';
}

function renderFitnessTraining(container){
  const sessions = [...entitiesOf('fitness')].sort((a,b)=>new Date(b.date)-new Date(a.date));
  container.innerHTML = `
    <div class="section-eyebrow">Pausen-Timer</div>
    <div class="rest-timer" id="restTimer">
      <div class="rt-display mono" id="rtDisplay">${formatTimer(restTimerRemaining)}</div>
      <div class="rt-presets">
        ${[30,60,90,120].map(s=>`<button class="rt-preset ${restTimerPreset===s?'active':''}" data-secs="${s}">${s}s</button>`).join('')}
      </div>
      <div class="rt-controls">
        <button class="wb-btn" id="rtStartBtn">${restTimerRunning?'Pause':'Start'}</button>
        <button class="wb-btn" id="rtResetBtn">Reset</button>
      </div>
    </div>

    <div class="section-eyebrow" style="margin-top:26px;">Neues Workout</div>
    <div id="workoutBuilder"></div>
    <div class="section-eyebrow" style="margin-top:22px;">Verlauf</div>
    <div id="fitnessSessionList"></div>

  wireRestTimer(container);

  renderWorkoutBuilder(document.getElementById('workoutBuilder'));

  listEl.innerHTML = sessions.length ? sessions.map(s=>{
    const exCount = (s.exercises||[]).length;
    const vol = Math.round(sessionVolume(s));
    return `<div class="row-item" style="align-items:flex-start;">
      <span class="rtxt">
        <strong>${esc(s.title)}</strong><br>
        <span style="color:var(--text-3); font-size:11.5px;">${exCount ? `${exCount} Übung(en) · ${vol} kg Volumen` : 'Keine Übungen erfasst'}${s.notes?` · ${esc(s.notes)}`:''}</span>
      </span>
      <span class="rmeta mono">${fmtDate(s.date)}</span>
      <button class="row-del" data-id="${s.id}" data-act="delworkout">${svg('trash')}</button>
    </div>`;
  }).join('') : emptyState('fitness','Noch kein Workout erfasst — leg dein erstes oben an.');
  listEl.querySelectorAll('[data-act="delworkout"]').forEach(btn=>btn.addEventListener('click', ()=>{
    if(!confirm('Dieses Workout wirklich löschen?')) return;
    if(!confirmedDelete(btn.dataset.id)) return; renderFitnessTraining(container);
  }));
}

function renderWorkoutBuilder(container){
  container.innerHTML = `
    <div class="add-row" style="margin-bottom:10px;">
      <input id="wbTitle" placeholder="Workout-Titel (optional)" style="flex:1.2;" value="${esc(workoutDraft.title)}">

function renderExerciseCard(ex, i){
  return `<div class="exercise-card">

        <div class="set-row">
          <span class="set-num">${j+1}</span>

          <span class="set-x">×</span>

        </div>`).join('')}

/* ---- Tab: Fortschritt (alles berechnet, nichts dupliziert) ---- */
function computeFitnessStats(){
  const sessions = entitiesOf('fitness').filter(s=>(s.exercises||[]).length);
  if(!sessions.length) return { hasData:false };
  const totalVolume = sessions.reduce((s,w)=>s+sessionVolume(w),0);
  const weekStart = periodBounds('week').start;
  const weekVolume = sessions.filter(w=>new Date(w.date)>=weekStart).reduce((s,w)=>s+sessionVolume(w),0);
  const weekCount = sessions.filter(w=>new Date(w.date)>=weekStart).length;

  const prByExercise = {}; const volumeByExercise = {};
  sessions.forEach(w=>(w.exercises||[]).forEach(ex=>{
    const key = ex.name.trim().toLowerCase();
    let exVolume = 0;
    (ex.sets||[]).forEach(set=>{
      exVolume += (set.reps||0)*(set.weight||0);
      if(!prByExercise[key] || set.weight>prByExercise[key].weight){
        prByExercise[key] = { name:ex.name, weight:set.weight, reps:set.reps, date:w.date };
      }
    });
    if(!volumeByExercise[key]) volumeByExercise[key] = { name:ex.name, volume:0 };
    volumeByExercise[key].volume += exVolume;
  }));
  const prList = Object.values(prByExercise).sort((a,b)=>b.weight-a.weight).slice(0,5);
  const strongest = Object.values(volumeByExercise).sort((a,b)=>b.volume-a.volume).slice(0,3);

  // Serie wiederverwendet dieselbe Logik wie bei Gewohnheiten — die Funktionen
  // erwarten nur ein Objekt mit .checked, kein neuer Streak-Algorithmus nötig.
  const trainingDates = { checked: [...new Set(sessions.map(w=>w.date))] };
  const currentStreak = computeStreak(trainingDates);
  const bestStreak = longestStreakEver(trainingDates);

  return { hasData:true, sessionsCount:sessions.length, totalVolume:Math.round(totalVolume), weekVolume:Math.round(weekVolume), weekCount, prList, strongest, currentStreak, bestStreak };
}

const MEAL_TYPES = ['Frühstück','Mittagessen','Abendessen','Snack'];

/* ---- Supplement Stack ----
   Eigene Entity-Art innerhalb des (versteckten) 'gesundheit'-Moduls: ein
   Supplement wird einmal mit Zeitfenster angelegt, "genommen" wird pro Tag
   über ein Datums-Array getoggelt — exakt dasselbe Muster wie bei
   Gewohnheiten (checked[]), nur unter neuem Namen (takenDates[]). */
/* Timing Reader: deterministisch, kein KI-Aufruf. Eine kleine Wissensbasis
   bekannter Präparate wird gegen die tatsächlich eingetragenen Supplements
   gematcht — es werden nur Tipps zu Dingen gezeigt, die wirklich im Stack
   stehen, nichts Erfundenes, kein generischer Ratgeber. Jedes Präparat hat
   eine eigene Farbe, die nur Label, Name und Punkte einfärbt — die
   Erklärung selbst bleibt neutral, damit sie lesbar bleibt. */
const SUPPLEMENT_TIMING_TIPS = [
  { match:/magnesium/i, label:'Timing Tip', name:'Magnesium', desc:'abends, zum Abendessen. Konsistenz schlägt Timing.', color:'#7BC99E' },
  { match:/koffein|caffeine|coffein/i, label:'Für dich', name:'Koffein', desc:'20–45 Minuten vor dem Training ist der Sweet Spot.', color:'#35C2E8' },
  { match:/kreatin|creatine/i, label:'Wusstest du?', name:'Kreatin', desc:'Tageszeit egal — die Ladephase kannst du dir sparen.', color:'#9B8CFF' },
  { match:/vitamin ?d/i, label:'Timing Tip', name:'Vitamin D', desc:'zu einer fetthaltigen Mahlzeit — bessere Aufnahme.', color:'#F5B94F' },
  { match:/omega|fischöl|fish ?oil/i, label:'Für dich', name:'Omega-3', desc:'zu einer Mahlzeit, um Aufstoßen zu vermeiden.', color:'#FF8FB1' },
  { match:/zink|zinc/i, label:'Wusstest du?', name:'Zink', desc:'nicht zusammen mit Kalzium — sie konkurrieren um Aufnahme.', color:'#FFB84F' },
  { match:/eisen|iron/i, label:'Timing Tip', name:'Eisen', desc:'nüchtern mit Vitamin C wirkt am zuverlässigsten.', color:'#F87171' },
  { match:/melatonin/i, label:'Für dich', name:'Melatonin', desc:'30–60 Minuten vor dem Schlafengehen.', color:'#7C9BFF' },
  { match:/protein|whey/i, label:'Timing Tip', name:'Protein', desc:'die Tagesmenge zählt mehr als der genaue Zeitpunkt.', color:'#5EAE7E' },
  { match:/b ?12/i, label:'Wusstest du?', name:'B12', desc:'morgens auf nüchternen Magen am besten aufgenommen.', color:'#4AA9CF' },
  { match:/ashwagandha/i, label:'Für dich', name:'Ashwagandha', desc:'abends kann beim Runterkommen helfen.', color:'#B08CFF' },
  { match:/vitamin ?c/i, label:'Timing Tip', name:'Vitamin C', desc:'über den Tag verteilt wirkt besser als eine Einzeldosis.', color:'#F5C46E' },
];
function computeSupplementTips(supplements){
  if(!supplements.length) return [];
  const tips = [];
  supplements.forEach(s=>{
    const found = SUPPLEMENT_TIMING_TIPS.find(t=>t.match.test(s.title));
    if(found && !tips.some(x=>x.name===found.name)) tips.push(found);
  });
  if(!tips.length){
    tips.push({ label:'Timing Tip', name:'Dein Stack', desc:'Konsistenz schlägt Timing — nimm deine Präparate zur gleichen Zeit, jeden Tag.', color:'#7BC99E' });
  }
  return tips;
}

/* Rotiert automatisch durch die passenden Tipps, sanfter Fade statt Sprung,
   Punkte unten pulsieren dezent auf dem aktiven Tipp. Läuft clientseitig
   per setInterval — global getrackt, damit sie beim Verlassen des Panels
   sauber gestoppt wird (siehe openPanel). */
let timingReaderInterval = null;
function mountTimingReader(container, supplements){
  if(timingReaderInterval){ clearInterval(timingReaderInterval); timingReaderInterval = null; }
  const mount = container.querySelector('#timingReaderSection');
  if(!mount) return;
  const tips = computeSupplementTips(supplements);
  if(!tips.length){ mount.innerHTML = ''; return; }
  const FLASH_MS = 650;   // Dauer eines einzelnen Blitzes
  const FLASH_COUNT = 3;  // so viele Blitze pro Tipp, bevor gewechselt wird
  const ROTATE_MS = FLASH_MS * FLASH_COUNT;

  mount.innerHTML = `
    <div class="section-eyebrow" style="margin-top:28px;">Timing Reader</div>
    <div class="tr-card" id="trCard">
      <span class="tr-pill" id="trPill"></span>
      ${tips.length>1 ? `<div class="tr-bar-track"><div class="tr-bar-fill" id="trBar"></div></div>` : ''}
      <div class="tr-text"><strong id="trName"></strong> <span id="trDesc"></span></div>
      <div class="tr-dots" id="trDots">${tips.map((_,i)=>`<span class="tr-dot" data-i="${i}"></span>`).join('')}</div>
    </div>
  `;

  let idx = 0;
  function paint(){
    const card = mount.querySelector('#trCard'); if(!card) return;
    const tip = tips[idx];
    card.style.setProperty('--tr-color', tip.color);
    card.classList.remove('tr-in'); void card.offsetWidth; card.classList.add('tr-in');
    mount.querySelector('#trPill').textContent = tip.label;
    mount.querySelector('#trName').textContent = tip.name + ':';
    mount.querySelector('#trDesc').textContent = tip.desc;
    mount.querySelectorAll('.tr-dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
    const bar = mount.querySelector('#trBar');
    if(bar){ bar.style.animation='none'; void bar.offsetWidth; bar.style.animation=`trFlash ${FLASH_MS}ms ease-out ${FLASH_COUNT}`; }
  }
  paint();
  if(tips.length>1){
    timingReaderInterval = setInterval(()=>{
      idx = (idx+1) % tips.length;
      paint();
    }, ROTATE_MS);
  }
}

  const monthBurn = items.filter(f=>f.amount<0 && f.createdAt>=monthStart.getTime()).reduce((s,f)=>s+Math.abs(f.amount),0);

  document.getElementById('panelBody').innerHTML = `
    <div class="fin-eyebrow">Finanzen</div>

    <div class="module-intro-subtitle" style="margin-bottom:20px;">Ausgaben, die sich nicht mehr verstecken.</div>

      ${financeRadarSVG(ratio, {color:'#FFB84F'})}
      <div>
        <div class="fin-burn-label">Ausgaben diesen Monat</div>

/* ---- Tab: Analyse ---- */
function computeNutritionStats(){
  const items = entitiesOf('ernaehrung');
  if(!items.length) return { hasData:false };
  const today = new Date();
  const dayTotals = [];
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i); const ds=todayStrOf(d);
    const dayMeals = items.filter(e=>e.date===ds);
    if(dayMeals.length) dayTotals.push({
      kcal: dayMeals.reduce((s,e)=>s+(e.kcal||0),0),
      protein: dayMeals.reduce((s,e)=>s+(e.protein||0),0),
      carbs: dayMeals.reduce((s,e)=>s+(e.carbs||0),0),
      fat: dayMeals.reduce((s,e)=>s+(e.fat||0),0),
    });
  }
  if(!dayTotals.length) return { hasData:false };
  const avgKcal = dayTotals.reduce((s,d)=>s+d.kcal,0)/dayTotals.length;
  const avgProtein = dayTotals.reduce((s,d)=>s+d.protein,0)/dayTotals.length;
  const avgCarbs = dayTotals.reduce((s,d)=>s+d.carbs,0)/dayTotals.length;
  const avgFat = dayTotals.reduce((s,d)=>s+d.fat,0)/dayTotals.length;
  const proteinTarget = getModuleSetting('ernaehrung','protein',null);
  const proteinConsistency = proteinTarget ? Math.round(dayTotals.filter(d=>d.protein>=proteinTarget*0.9).length/dayTotals.length*100) : null;
  return { hasData:true, daysLogged:dayTotals.length, avgKcal, avgProtein, avgCarbs, avgFat, proteinConsistency, proteinTarget };
}
function computeTrainingNutritionInsight(){
  const meals = entitiesOf('ernaehrung');
  const workouts = entitiesOf('fitness').filter(w=>(w.exercises||[]).length);
  if(!meals.length || !workouts.length) return null;
  const trainingDates = new Set(workouts.map(w=>w.date));
  const kcalByDate = {}, proteinByDate = {};
  meals.forEach(m=>{
    kcalByDate[m.date] = (kcalByDate[m.date]||0) + (m.kcal||0);
    proteinByDate[m.date] = (proteinByDate[m.date]||0) + (m.protein||0);
  });
  const splitByTrainingDay = byDate => {
    const t = [], r = [];
    Object.entries(byDate).forEach(([date,val])=>{ (trainingDates.has(date) ? t : r).push(val); });
    return { t, r };
  };
  const avg = arr => arr.reduce((s,v)=>s+v,0)/arr.length;

  const sentences = [];
  const kcalSplit = splitByTrainingDay(kcalByDate);
  if(kcalSplit.t.length && kcalSplit.r.length){
    const diff = Math.round(avg(kcalSplit.t) - avg(kcalSplit.r));
    if(Math.abs(diff)>=10) sentences.push(`An Trainingstagen isst du im Schnitt ${Math.abs(diff)} kcal ${diff>0?'mehr':'weniger'} als an trainingsfreien Tagen.`);
  }
  const proteinTarget = getModuleSetting('ernaehrung','protein',null);
  const proteinSplit = splitByTrainingDay(proteinByDate);
  if(proteinTarget && proteinSplit.t.length && proteinSplit.r.length){
    const hitRate = arr => Math.round(arr.filter(v=>v>=proteinTarget*0.9).length/arr.length*100);
    const tRate = hitRate(proteinSplit.t), rRate = hitRate(proteinSplit.r);
    if(tRate!==rRate) sentences.push(`Dein Protein-Ziel erreichst du an Trainingstagen in ${tRate}% der Fälle, an trainingsfreien Tagen in ${rRate}%.`);
  } else if(proteinSplit.t.length && proteinSplit.r.length){
    const diffP = Math.round(avg(proteinSplit.t) - avg(proteinSplit.r));
    if(Math.abs(diffP)>=3) sentences.push(`Bei Protein isst du an Trainingstagen im Schnitt ${Math.abs(diffP)}g ${diffP>0?'mehr':'weniger'} als an trainingsfreien Tagen.`);
  }
  return sentences.length ? sentences.join(' ') : null;
}
function renderNutritionAnalyse(container){
  const stats = computeNutritionStats();
  if(!stats.hasData){
    container.innerHTML = emptyState('nutrition','Noch nicht genug Mahlzeiten für eine Analyse — erfasse ein paar Tage lang, dann füllt sich diese Ansicht.');
    return;
  }
  const kcalFromMacros = stats.avgProtein*4 + stats.avgCarbs*4 + stats.avgFat*9;
  const donutSegments = kcalFromMacros>0 ? [
    { label:'Protein', value: stats.avgProtein*4, color:'#9B8CFF' },
    { label:'Carbs', value: stats.avgCarbs*4, color:'#F5B94F' },
    { label:'Fett', value: stats.avgFat*9, color:'#FF8FB1' },
  ] : [];
  const trend = getModuleTrend(findModule('ernaehrung'));
  const crossInsight = computeTrainingNutritionInsight();

  container.innerHTML = `
    <div class="section-eyebrow">Letzte ${stats.daysLogged} Tage mit Einträgen</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${Math.round(stats.avgKcal)}</div><div class="lbl">Ø kcal / Tag</div></div>
      <div class="stat-card"><div class="num">${Math.round(stats.avgProtein)}g</div><div class="lbl">Ø Protein / Tag</div></div>
    </div>
    ${stats.proteinConsistency!==null ? `<div class="insight-row">Protein-Ziel an ${stats.proteinConsistency}% der erfassten Tage erreicht oder fast erreicht.</div>` : ''}
    ${crossInsight ? `<div class="insight-row">${esc(crossInsight)}</div>` : ''}

    <div class="section-eyebrow">Makro-Verteilung (Ø, nach Kalorienanteil)</div>
    <div style="display:flex; align-items:center; gap:20px; margin-bottom:8px;">
      ${donutSegments.length ? chartDonut(donutSegments, {size:100}) : `<div class="chart-empty">Keine Makros erfasst.</div>`}
      <div style="font-size:12px; color:var(--text-2); display:flex; flex-direction:column; gap:6px;">
        ${donutSegments.map(s=>`<div><span style="display:inline-block; width:8px; height:8px; border-radius:2px; background:${s.color}; margin-right:6px;"></span>${s.label}</div>`).join('')}
      </div>
    </div>

    <div class="section-eyebrow">Kalorien über Zeit</div>
    <div class="trend-card">${trend.insufficient ? `<div class="chart-empty">${trend.message}</div>` : chartLine(trend.series.kcal.points, {color:'#7BC99E', fill:true})}</div>
  `;
}

/* ============ SCHOOL & LEARNING HUB ============
   Erstes Modul, das die Eltern-Kind-Verknüpfung wirklich braucht: ein Fach
   ist die Eltern-Entity, alles andere (Lerneinheiten, Prüfungen, Hausaufgaben,
   Lernziele, Notizen) hängt per parentId daran. EIN moduleKey ('schule'),
   unterschieden über das 'type'-Feld — kein Extra-Registry-Eintrag pro
   Unterbereich, weil das keine eigenständigen Module sind, sondern Teile
   eines Fachs. Löschen eines Fachs nutzt deleteEntityCascade + die
   kinderzählende Bestätigung aus der Grundlagen-Phase — nicht neu gebaut,
   nur zum ersten Mal wirklich gebraucht. */
const EXAM_PRIORITIES = ['Niedrig','Mittel','Hoch'];
const PRIORITY_COLOR = {Niedrig:['var(--text-3)','var(--surface-3)'], Mittel:['#F5B94F','rgba(245,185,79,0.14)'], Hoch:['var(--danger)','var(--danger-dim)']};
let schoolTab = 'faecher';
let schoolSelectedSubject = null;

function renderSchoolHub(){
  const tabs = [['faecher','Fächer'],['sessions','Lernsessions'],['pruefungen','Prüfungen'],['fortschritt','Fortschritt']]
    .map(([key,label])=>`<button class="period-tab ${schoolTab===key?'active':''}" data-schtab="${key}">${label}</button>`).join('');
  document.getElementById('panelBody').innerHTML = `${moduleIntroHTML('schule')}<div class="period-tabs">${tabs}</div><div id="schoolTabBody"></div>`;
  document.querySelectorAll('[data-schtab]').forEach(btn=>btn.addEventListener('click', ()=>{
    schoolTab = btn.dataset.schtab; schoolSelectedSubject = null; renderSchoolHub();
  }));
  const body = document.getElementById('schoolTabBody');
  if(schoolTab==='faecher') renderSchoolSubjects(body);
  else if(schoolTab==='sessions') renderSchoolSessions(body);
  else if(schoolTab==='pruefungen') renderSchoolExams(body);
  else renderSchoolProgress(body);
}

function subjectsList(){ return entitiesOf('schule').filter(e=>e.type==='subject'); }
function subjectMinutes(subjectId, sinceDate){
  return entitiesOf('schule').filter(e=>e.type==='session' && e.parentId===subjectId && (!sinceDate || new Date(e.date)>=sinceDate))
    .reduce((s,e)=>s+(e.duration||0),0);
}
function daysUntil(dateStr){
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d-today)/86400000);
}
function countdownLabel(dateStr){
  const days = daysUntil(dateStr);
  if(days<0) return `${Math.abs(days)} Tag(e) überfällig`;
  if(days===0) return 'heute';
  if(days===1) return 'morgen';
  return `in ${days} Tagen`;
}

    </div>`;
  }).join('');
  listEl.querySelectorAll('[data-act="opensubject"]').forEach(el=>el.addEventListener('click', e=>{
    if(e.target.closest('[data-act="delsubject"]')) return;
    schoolSelectedSubject = el.dataset.id; renderSchoolSubjects(container);

  listEl.querySelectorAll('[data-act="delsubject"]').forEach(btn=>btn.addEventListener('click', e=>{

/* ============ HABIT TRACKER PREMIUM ============
   Erweiterung des BESTEHENDEN 'gewohnheiten'-Moduls, kein neues — dieselben
   Entities, derselbe computeScore/computeTrend aus der Registry, nur eine
   deutlich reichhaltigere Oberfläche + eine eigene Muster-Erkennung obendrauf.
   longestStreakEver() ergänzt computeStreak() (aktuelle Serie) um die
   historisch längste Serie — beides bleibt rein berechnet aus dem
   checked-Array, nichts davon wird zusätzlich gespeichert. */
function longestStreakEver(habit){
  const dates = [...new Set(habit.checked||[])].sort();
  if(!dates.length) return 0;
  let longest=1, current=1;
  for(let i=1;i<dates.length;i++){
    const diffDays = Math.round((new Date(dates[i]) - new Date(dates[i-1]))/86400000);
    current = diffDays===1 ? current+1 : 1;
    longest = Math.max(longest, current);
  }
  return longest;
}
/* Erfolgsrate über ein Zeitfenster, aber nie über den Tag hinaus zurück, an
   dem die Gewohnheit tatsächlich angelegt wurde — sonst würde eine drei Tage
   alte Gewohnheit fälschlich so aussehen, als hätte sie 27 Tage "versagt". */
function habitSuccessRate(habit, days){
  const today = new Date(); today.setHours(0,0,0,0);
  const windowStart = new Date(today); windowStart.setDate(today.getDate()-(days-1));
  const created = habit.createdAt ? new Date(habit.createdAt) : windowStart;
  const effectiveStart = created > windowStart ? created : windowStart;
  const totalDays = Math.max(1, Math.round((today-effectiveStart)/86400000)+1);
  const checkedInRange = (habit.checked||[]).filter(ds=>{ const d=new Date(ds); return d>=effectiveStart && d<=today; }).length;
  return { rate: Math.round(checkedInRange/totalDays*100), totalDays };
}
function rankHabits(){
  const habits = entitiesOf('gewohnheiten');
  const eligible = habits.filter(h=>{
    const ageDays = h.createdAt ? (Date.now()-h.createdAt)/86400000 : 0;
    return ageDays >= 7; // erst nach einer Woche fair bewertbar
  }).map(h=>({ title:h.title, id:h.id, rate: habitSuccessRate(h,30).rate }));
  return {
    list: eligible,
    best: [...eligible].sort((a,b)=>b.rate-a.rate).slice(0,3),
    hardest: [...eligible].sort((a,b)=>a.rate-b.rate).slice(0,3),
  };
}

/* ---- Habit Insights: Muster nur mit ausreichender Datenbasis ---- */
function weekendVsWeekdayInsight(habit){
  const checked = habit.checked||[];
  if(checked.length<6) return null;
  const today = new Date(); let weekendHits=0, weekendTotal=0, weekdayHits=0, weekdayTotal=0;
  const created = habit.createdAt ? new Date(habit.createdAt) : null;
  for(let i=0;i<56;i++){
    const d = new Date(today); d.setDate(today.getDate()-i);
    if(created && d<created) break;
    const isWeekend = d.getDay()===0 || d.getDay()===6;
    const ds = todayStrOf(d);
    if(isWeekend){ weekendTotal++; if(checked.includes(ds)) weekendHits++; }
    else { weekdayTotal++; if(checked.includes(ds)) weekdayHits++; }
  }
  if(weekendTotal<3 || weekdayTotal<5) return null;
  const weekendRate = weekendHits/weekendTotal, weekdayRate = weekdayHits/weekdayTotal;
  if(weekendRate-weekdayRate>0.25) return `"${habit.title}" gelingt dir häufiger am Wochenende (${Math.round(weekendRate*100)}% vs. ${Math.round(weekdayRate*100)}% wochentags).`;
  if(weekdayRate-weekendRate>0.25) return `"${habit.title}" gelingt dir häufiger wochentags (${Math.round(weekdayRate*100)}% vs. ${Math.round(weekendRate*100)}% am Wochenende).`;
  return null;
}
function improvingTrendInsight(habit){
  if(!habit.createdAt) return null;
  const weeksSinceCreation = (Date.now()-habit.createdAt)/(7*86400000);
  if(weeksSinceCreation<3) return null;
  const today = new Date(); const weekRates=[];
  for(let w=3; w>=0; w--){
    let hits=0;
    for(let d=0; d<7; d++){ const day=new Date(today); day.setDate(today.getDate()-w*7-d); if((habit.checked||[]).includes(todayStrOf(day))) hits++; }
    weekRates.push(hits/7);
  }
  if(weekRates[3]-weekRates[0]>=0.3){
    return `Deine Gewohnheit "${habit.title}" verbessert sich seit einigen Wochen (${Math.round(weekRates[0]*100)}% → ${Math.round(weekRates[3]*100)}%).`;
  }
  return null;
}
function computeHabitInsights(){
  const habits = entitiesOf('gewohnheiten');
  if(!habits.length) return [];
  const insights = [];
  habits.forEach(h=>{
    const wv = weekendVsWeekdayInsight(h); if(wv) insights.push(wv);
    const tr = improvingTrendInsight(h); if(tr) insights.push(tr);
  });
  return insights.slice(0,4);
}

  const thisWeekCount = habits.reduce((s,h)=>s+(h.checked||[]).filter(ds=>new Date(ds)>=weekStart).length,0);
  const prevWeekCount = habits.reduce((s,h)=>s+(h.checked||[]).filter(ds=>{ const d=new Date(ds); return d>=prevWeekStart && d<=prevWeekEnd; }).length,0);

  const prevMonthCount = habits.reduce((s,h)=>s+(h.checked||[]).filter(ds=>{ const d=new Date(ds); return d>=prevMonthStart && d<=prevMonthEnd; }).length,0);

  const rank = rankHabits();
  const avgRate = rank.list.length ? Math.round(rank.list.reduce((s,r)=>s+r.rate,0)/rank.list.length) : null;
  const insights = computeHabitInsights();
  const trend = getModuleTrend(findModule('gewohnheiten'));

  container.innerHTML = `
    <div class="stat-grid">

      <div class="stat-card"><div class="num">${thisWeekCount}</div><div class="lbl">Erledigt diese Woche</div></div>
    </div>
    <div class="insight-row">${prevWeekCount>0 ? `Diese Woche ${thisWeekCount}× erledigt, letzte Woche ${prevWeekCount}× (${thisWeekCount>=prevWeekCount?'+':''}${thisWeekCount-prevWeekCount}).` : `Diese Woche ${thisWeekCount}× erledigt — noch keine Vorwoche zum Vergleich.`}</div>
    <div class="insight-row">${prevMonthCount>0 ? `Dieser Monat ${thisMonthCount}× erledigt, letzter Monat ${prevMonthCount}× (${thisMonthCount>=prevMonthCount?'+':''}${thisMonthCount-prevMonthCount}).` : `Dieser Monat ${thisMonthCount}× erledigt — noch kein Vormonat zum Vergleich.`}</div>

/* ============ EVOLUTION LAB ============
   Kein Beauty-Rating, kein Looksmaxxing-Score — ausschließlich ein
   Konsistenz-Tracker für selbstgewählte Routinen, unterteilt in fünf
   Selbstpflege-Bereiche über die subKey-Ebene. EIN moduleKey ('evolution'),
   EIN Renderer (renderEvolutionArea) für alle fünf Tabs — nur subKey und
   Label unterscheiden sich. Das ist bewusst die höchste Wiederverwendungs-
   stufe im ganzen Projekt: fünf UI-Bereiche aus einer einzigen Funktion. */
const EVOLUTION_AREAS = [
  {key:'skincare', label:'Skin Care', short:'Skin'},
  {key:'hair', label:'Hair', short:'Hair'},
  {key:'facecare', label:'Face Care', short:'Face'},
  {key:'style', label:'Style', short:'Style'},
  {key:'grooming', label:'Grooming', short:'Grooming'},
];

/* Muster nur mit echter Datenbasis — dieselbe Zurückhaltung wie bei den
   Habit Insights, nur auf fünf Bereiche statt einzelne Gewohnheiten angewandt. */
function computeEvolutionInsights(){
  const items = entitiesOf('evolution');
  const routines = items.filter(e=>e.type==='routine');
  if(!routines.length) return [];
  const insights = []; const today = new Date();

  EVOLUTION_AREAS.forEach(area=>{
    const areaRoutines = routines.filter(r=>r.subKey===area.key);
    if(!areaRoutines.length) return;

    const oldEnough = areaRoutines.filter(r=>r.createdAt && (Date.now()-r.createdAt)/86400000>=28);
    if(oldEnough.length){
      const rates = oldEnough.map(r=>{
        let hits=0; for(let i=0;i<28;i++){ const d=new Date(today); d.setDate(d.getDate()-i); if((r.checked||[]).includes(todayStrOf(d))) hits++; }
        return hits/28;
      });
      const avg = rates.reduce((s,r)=>s+r,0)/rates.length;
      if(avg>=0.85) insights.push(`Deine ${area.label}-Routine ist seit vier Wochen sehr konstant (${Math.round(avg*100)}%).`);
    }
    const hadPriorActivity = areaRoutines.some(r=>{
      for(let i=7;i<35;i++){ const d=new Date(today); d.setDate(d.getDate()-i); if((r.checked||[]).includes(todayStrOf(d))) return true; }
      return false;
    });
    const thisWeekActivity = areaRoutines.some(r=>{
      for(let i=0;i<7;i++){ const d=new Date(today); d.setDate(d.getDate()-i); if((r.checked||[]).includes(todayStrOf(d))) return true; }
      return false;
    });
    if(hadPriorActivity && !thisWeekActivity) insights.push(`Deine ${area.label}-Routine ist diese Woche ausgefallen.`);
  });

  const morning = routines.filter(r=>r.timeOfDay==='morgen');
  const evening = routines.filter(r=>r.timeOfDay==='abend');
  if(morning.length && evening.length){
    const rate = list=>{
      let hits=0, total=0;
      list.forEach(r=>{ for(let i=0;i<14;i++){ const d=new Date(today); d.setDate(d.getDate()-i); total++; if((r.checked||[]).includes(todayStrOf(d))) hits++; } });
      return total ? hits/total : 0;
    };
    const mRate = rate(morning), eRate = rate(evening);
    if(Math.abs(mRate-eRate)>0.25){
      insights.push(mRate>eRate
        ? `Deine Morgenroutine funktioniert deutlich besser als deine Abendroutine (${Math.round(mRate*100)}% vs. ${Math.round(eRate*100)}%).`
        : `Deine Abendroutine funktioniert deutlich besser als deine Morgenroutine (${Math.round(eRate*100)}% vs. ${Math.round(mRate*100)}%).`);
    }
  }
  return insights.slice(0,4);
}

/* ============ EXPORT / IMPORT ============
   Ausschließlich über die bestehende Storage-Schicht (safeGet/safeSet) —
   kein direkter localStorage/window.storage-Zugriff, keine neue
   Datenstruktur. Memory-Fakten stecken bereits als Entities INNERHALB von
   aria-entities (kein separater Schlüssel), sind also automatisch mit dabei.

   Bewusst als eigenständige, kleine Funktionen gebaut (buildNovaExport liefert
   reines Datenobjekt, keine Download-Logik) — ein späteres Cloud-Sync kann
   dieselbe Funktion für den "Upload"-Teil wiederverwenden, ohne dass diese
   Export/Import-Funktionen hier angefasst werden müssten.

   NOVA_SCHEMA_VERSION beschreibt die Form der exportierten Daten (nicht die
   App-Version) — hochzählen, wenn sich die Struktur von entities/settings/
   chat grundlegend ändert, damit künftige Importe wissen, ob eine Datei aus
   einer älteren oder neueren Welt kommt. */
const NOVA_DATA_KEYS = ['aria-entities','aria-settings','aria-chat'];
const NOVA_SCHEMA_VERSION = 1;
const NOVA_APP_VERSION = '1.0.0';

async function buildNovaExport(){
  const data = {};
  for(const key of NOVA_DATA_KEYS){ data[key] = await safeGet(key); }
  return { app:'NOVA', exportVersion:NOVA_SCHEMA_VERSION, exportedAt:new Date().toISOString(), data };
}

async function exportNovaData(){
  const payload = await buildNovaExport();
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const a = document.createElement('a');
  a.href = url; a.download = `nova-export-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Export heruntergeladen');
}

/* Prüft jeden der drei Schlüssel einzeln gegen dieselben Validierungen wie
   loadState() — eine Datei, die einen Schlüssel korrekt und einen anderen
   fehlerhaft enthält, führt zu EINER klaren Fehlermeldung statt dazu, dass
   nur der kaputte Teil beim nächsten Neuladen unbemerkt zuschlägt. */
function validateNovaImportData(data){
  const problems = [];
  if('aria-entities' in data && data['aria-entities']!=null && !sanitizeEntities(data['aria-entities'])){
    problems.push('aria-entities ist kein gültiges Array von Einträgen.');
  }
  if('aria-chat' in data && data['aria-chat']!=null && !sanitizeChat(data['aria-chat'])){
    problems.push('aria-chat ist kein gültiges Array von Nachrichten.');
  }
  if('aria-settings' in data && data['aria-settings']!=null && !sanitizeSettings(data['aria-settings'])){
    problems.push('aria-settings ist kein gültiges Einstellungs-Objekt.');
  }
  return problems;
}

async function importNovaDataFromFile(file){
  let parsed;
  try{
    parsed = JSON.parse(await file.text());
  }catch(e){
    alert('Diese Datei ist kein gültiger NOVA-Export (kein lesbares JSON).');
    return;
  }
  if(!parsed || typeof parsed!=='object' || !parsed.data || parsed.app!=='NOVA'){
    alert('Diese Datei sieht nicht wie ein NOVA-Export aus.');
    return;
  }

  const problems = validateNovaImportData(parsed.data);
  if(problems.length){
    alert('Diese Datei kann nicht importiert werden — sie ist beschädigt oder in einem unerwarteten Format:\n\n'+problems.join('\n'));
    return;
  }

  let versionNote = '';
  if(typeof parsed.exportVersion==='number' && parsed.exportVersion!==NOVA_SCHEMA_VERSION){
    versionNote = parsed.exportVersion > NOVA_SCHEMA_VERSION
      ? `\n\nHinweis: Diese Datei stammt aus einer neueren NOVA-Version (Format ${parsed.exportVersion}, diese App kennt Format ${NOVA_SCHEMA_VERSION}). Einzelne neuere Felder werden möglicherweise nicht übernommen.`
      : `\n\nHinweis: Diese Datei stammt aus einer älteren NOVA-Version (Format ${parsed.exportVersion}). Der Import sollte trotzdem funktionieren.`;
  }

  const exportedLabel = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString('de-DE') : 'unbekanntem Zeitpunkt';
  const confirmed = confirm(
    `Du importierst einen NOVA-Export vom ${exportedLabel}.\n\n` +
    `WARNUNG: Das überschreibt deinen aktuellen Datenbestand (Aufgaben, Notizen, Gewohnheiten, Memory, Chat-Verlauf, Einstellungen) vollständig mit dem Inhalt dieser Datei. Das lässt sich nicht rückgängig machen.` +
    versionNote +
    `\n\nWirklich fortfahren?`
  );
  if(!confirmed) return;

  for(const key of NOVA_DATA_KEYS){
    if(key in parsed.data && parsed.data[key]!=null) await safeSet(key, parsed.data[key]);
  }
  toast('Import abgeschlossen — NOVA wird neu geladen');
  setTimeout(()=>location.reload(), 700);
}

/* ============ COMMAND PALETTE ============ */
const paletteOverlay = document.getElementById('paletteOverlay');
const paletteInput = document.getElementById('paletteInput');
const paletteResults = document.getElementById('paletteResults');
let palIndex = 0; let palItems = [];

function buildPalette(query){
  const q = (query||'').toLowerCase().trim();
  const actions = [{key:'__newchat', label:'Neue Unterhaltung starten', icon:'bolt', run:startNewChat}];
  const secMatches = SECTIONS.concat([{key:'einstellungen', label:'Einstellungen', icon:'settings'}])
    .filter(s=>!q || s.label.toLowerCase().includes(q));
  const actMatches = actions.filter(a=>!q || a.label.toLowerCase().includes(q));

  palItems = [];
  let html = '';
  if(actMatches.length){
    html += `<div class="pal-group-label">Aktionen</div>`;
    actMatches.forEach(a=>{
      const idx = palItems.length; palItems.push({type:'action', ref:a});
      html += `<div class="pal-item ${idx===palIndex?'active':''}" data-idx="${idx}">${svg(a.icon)}<span>${a.label}</span></div>`;
    });
  }
  if(secMatches.length){
    html += `<div class="pal-group-label">Bereiche</div>`;
    secMatches.forEach(s=>{
      const idx = palItems.length; palItems.push({type:'section', ref:s});
      html += `<div class="pal-item ${idx===palIndex?'active':''}" data-idx="${idx}">${svg(s.icon)}<span>${s.label}</span></div>`;
    });
  }
  paletteResults.innerHTML = html || `<div class="panel-empty" style="padding:24px;">Keine Treffer.</div>`;
  paletteResults.querySelectorAll('.pal-item').forEach(el=>{
    el.addEventListener('click', ()=>{ palIndex = parseInt(el.dataset.idx); selectPaletteItem(); });
  });
}
function selectPaletteItem(){
  const item = palItems[palIndex]; if(!item) return;
  closePalette();
  if(item.type==='action') item.ref.run();
  else openPanel(item.ref.key);
}
function openPalette(){
  paletteOverlay.classList.add('show'); palIndex=0; paletteInput.value=''; buildPalette('');
  setTimeout(()=>paletteInput.focus(), 30);
}
function closePalette(){ paletteOverlay.classList.remove('show'); }
document.getElementById('searchTrigger').addEventListener('click', openPalette);
paletteOverlay.addEventListener('click', e=>{ if(e.target===paletteOverlay) closePalette(); });
paletteInput.addEventListener('input', ()=>{ palIndex=0; buildPalette(paletteInput.value); });
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); paletteOverlay.classList.contains('show')?closePalette():openPalette(); return; }
  if(paletteOverlay.classList.contains('show')){
    if(e.key==='Escape'){ closePalette(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); palIndex=Math.min(palIndex+1, palItems.length-1); buildPalette(paletteInput.value); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palIndex=Math.max(palIndex-1,0); buildPalette(paletteInput.value); }
    else if(e.key==='Enter'){ e.preventDefault(); selectPaletteItem(); }
    return;
  }
  if(e.key==='Escape' && currentSection){ closePanel(); }
});

/* Sicherheit vor Aktion: löschen läuft nie direkt durch. Die Zusage kommt aus
   der UI (Klick), nicht aus dem Sprachmodell — der Loop pausiert technisch,
   bis der Mensch geklickt hat. */
function requestDeleteConfirmation(entity, reason){
  return new Promise(resolve=>{
    const kidCount = countDescendants(entity.id);
    const messagesEl = document.getElementById('messages');
    document.getElementById('emptyState').style.display = 'none';
    messagesEl.style.display = 'flex';
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML = `<div class="label">NOVA</div>
      <div class="confirm-box">
        <div class="confirm-text">Soll ich <strong>„${esc(entity.title)}"</strong> wirklich löschen?${kidCount ? ` Das betrifft auch <strong>${kidCount} verknüpfte Einträge</strong> darunter.` : ''}${reason ? ` <span style="color:var(--text-3);">(${esc(reason)})</span>` : ''}</div>
        <div class="confirm-actions">
          <button class="btn-confirm-no">Abbrechen</button>
          <button class="btn-confirm-yes">Ja, löschen</button>
        </div>
      </div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    wrap.querySelector('.btn-confirm-yes').addEventListener('click', ()=>{ wrap.remove(); resolve(true); });
    wrap.querySelector('.btn-confirm-no').addEventListener('click', ()=>{ wrap.remove(); resolve(false); });
  });
}

/* Nach jeder Werkzeug-Ausführung wird ein offenes Panel live neu gezeichnet —
   NOVA "tut" sichtbar etwas, statt nur im Chat davon zu behaupten. */
function refreshOpenPanelAfterToolUse(){
  if(currentSection) renderPanel(currentSection);
  if(currentMainView==='dashboard') renderDashboardHome();
}

async function executeTool(name, input){
  input = input || {};
  switch(name){
    case 'query_entities': {
      let items = input.moduleKey ? entitiesOf(input.moduleKey) : entities;
      if(input.search){ const q = input.search.toLowerCase(); items = items.filter(e=>(e.title||'').toLowerCase().includes(q)); }
      if(input.parentId){ items = items.filter(e=>e.parentId===input.parentId); }
      return { results: items.slice(0,25).map(e=>{
        const known = ['id','moduleKey','type','title','tags','links','createdAt','updatedAt'];
        const extra = {};
        Object.keys(e).forEach(k=>{ if(!known.includes(k)) extra[k] = e[k]; });
        return Object.assign({ id:e.id, moduleKey:e.moduleKey, title:e.title }, extra);
      }) };
    }
    case 'create_entity': {
      const mod = findModule(input.moduleKey);
      if(!mod) return { error:`Unbekanntes Modul: ${input.moduleKey}` };
      if(!input.title) return { error:'Titel fehlt.' };
      let fields = { type:input.moduleKey, title:input.title };
      if(mod.mode==='progress') fields.progress = input.progress ?? 0;
      if(mod.mode==='status') fields.status = input.status || 'Aktiv';
      if(mod.mode==='checklist') fields.done = false;
      if(mod.mode==='habit') fields.checked = [];
      if(mod.mode==='date') fields.date = input.date || null;
      if(mod.mode==='finance') fields.amount = input.amount ?? 0;
      if(mod.mode==='multilog'){
        fields.date = input.date || todayStr();
        (mod.fields||[]).forEach(f=>{ fields[f.field] = (input.numericFields && input.numericFields[f.field]) || 0; });
      }
      if(mod.mode==='session'){
        fields.date = input.date || todayStr();
        fields.exercises = [];
        // Übungsdetails (Sätze/Wdh/Gewicht) folgen mit dem Fitness Hub über ein eigenes Tool —
        // generisch anlegen unterstützt hier nur den Platzhalter mit Titel/Datum.
      }
      if(mod.mode==='hub'){
        const et = input.entityType || 'note';
        fields.type = et;
        if(et==='session'){ fields.date = input.date || todayStr(); fields.duration = (input.numericFields && input.numericFields.duration) || 0; }
        if(et==='exam'){ fields.date = input.date || null; fields.status = input.status || 'Bevorstehend'; fields.priority = (input.stringFields && input.stringFields.priority) || 'Mittel'; }
        if(et==='homework'){ fields.done = false; }
        if(et==='goal'){ fields.progress = input.progress ?? 0; }
        if(et==='routine'){ fields.checked = []; }
        if(et==='timeline'){ fields.date = input.date || todayStr(); }
        if(input.subKey) fields.subKey = input.subKey;
      }
      if(input.stringFields){
        const reserved = ['id','moduleKey','type','createdAt','updatedAt','tags','links'];
        Object.keys(input.stringFields).forEach(k=>{ if(!reserved.includes(k)) fields[k] = String(input.stringFields[k]); });
      }
      if(input.parentId) fields.parentId = input.parentId;
      const e = createEntity(input.moduleKey, fields);
      refreshOpenPanelAfterToolUse();
      toast(`„${input.title}" hinzugefügt (${mod.label})`);
      return { success:true, id:e.id };
    }
    case 'update_entity': {
      const e = findEntity(input.id);
      if(!e) return { error:'Eintrag nicht gefunden. Nutze query_entities, um die richtige ID zu finden.' };
      updateEntity(input.id, input.patch || {});
      refreshOpenPanelAfterToolUse();
      toast('Eintrag aktualisiert');
      return { success:true };
    }
    case 'complete_task': {
      const e = findEntity(input.id);
      if(!e || e.moduleKey!=='aufgaben') return { error:'Aufgabe nicht gefunden.' };
      const done = input.done !== undefined ? input.done : true;
      updateEntity(input.id, { done, completedAt: done ? Date.now() : null });
      refreshOpenPanelAfterToolUse();
      toast(done ? 'Aufgabe erledigt' : 'Aufgabe wieder geöffnet');
      return { success:true };
    }
    case 'log_metric': {
      const mod = findModule(input.moduleKey);
      if(!mod || mod.mode!=='log') return { error:'Kein log-fähiges Modul.' };
      const e = todaysLogEntity(mod.key, mod.metrics);
      updateEntity(e.id, { [input.field]: input.value });
      refreshOpenPanelAfterToolUse();
      toast(`${mod.label} aktualisiert`);
      return { success:true };
    }
    case 'delete_entity': {
      const e = findEntity(input.id);
      if(!e) return { error:'Eintrag nicht gefunden.' };
      const confirmed = await requestDeleteConfirmation(e, input.reason);
      if(!confirmed) return { cancelled:true, message:'Der Nutzer hat das Löschen abgelehnt.' };
      const kidCount = countDescendants(input.id);
      deleteEntityCascade(input.id);
      refreshOpenPanelAfterToolUse();
      toast(kidCount ? `Eintrag + ${kidCount} verknüpfte Einträge gelöscht` : 'Eintrag gelöscht');
      return { success:true, deletedChildren: kidCount };
    }
    case 'save_memory': {
      if(!input.content) return { error:'content fehlt.' };
      const e = createEntity('memory', {
        type:'memoryFact', title:input.content, content:input.content,
        category: input.category || 'sonstiges',
        confidence: typeof input.confidence==='number' ? Math.max(0,Math.min(1,input.confidence)) : 0.75,
      });
      pruneMemoryIfNeeded();
      if(currentSection==='einstellungen') renderPanel('einstellungen');
      toast('NOVA hat sich etwas gemerkt');
      return { success:true, id:e.id };
    }
    case 'log_workout': {
      if(!input.exercises || !input.exercises.length) return { error:'Mindestens eine Übung nötig.' };
      const cleaned = input.exercises
        .map(ex=>({ name:(ex.name||'').trim(), sets:(ex.sets||[]).filter(s=>Number(s.reps)>0).map(s=>({reps:Number(s.reps), weight:Number(s.weight)||0})) }))
        .filter(ex=>ex.name && ex.sets.length);
      if(!cleaned.length) return { error:'Keine gültigen Übungen/Sätze übergeben (reps muss > 0 sein).' };
      const workoutType = input.workoutType || 'Sonstiges';
      const e = createEntity('fitness', {
        type:'workout', title: input.title || workoutType, date: input.date || todayStr(),
        workoutType, notes: input.notes || '', exercises: cleaned
      });
      refreshOpenPanelAfterToolUse();
      toast('Training protokolliert');
      return { success:true, id:e.id, volumeKg: Math.round(sessionVolume(e)) };
    }
    default:
      return { error:`Unbekanntes Tool: ${name}` };
  }
}

function buildContextSummary(){
  const lines = MODULE_REGISTRY.map(mod => mod.computeSummary(entitiesOf(mod.key), mod));
  return "Aktueller Datenstand des Nutzers:\n" + lines.join('\n');
}

function greetingText(){
  const h = new Date().getHours();
  if(h<6) return 'Gute Nacht';
  if(h<12) return 'Guten Morgen';
  if(h<18) return 'Guten Nachmittag';
  return 'Guten Abend';
}
document.getElementById('greeting').textContent = greetingText()+'.';

function renderChat(){
  const messagesEl = document.getElementById('messages');
  const emptyEl = document.getElementById('emptyState');
  if(!state.chat.length){ messagesEl.style.display='none'; emptyEl.style.display='flex'; return; }
  emptyEl.style.display='none'; messagesEl.style.display='flex';
  messagesEl.innerHTML = state.chat.map(m=>
    m.role==='user'
      ? `<div class="msg user">${esc(m.content)}</div>`
      : `<div class="msg assistant"><div class="label">NOVA</div>${esc(m.content)}</div>`
  ).join('');

   nie das rohe JSON-Objekt anzeigen. */
function toolChipLabel(name, input){
  input = input || {};
  const modLabel = k => { const m=findModule(k); return m?m.label:k; };
  switch(name){
    case 'query_entities': return `Durchsucht ${input.moduleKey ? modLabel(input.moduleKey) : 'alle Bereiche'}`;
    case 'create_entity': return `Legt an${input.title?': '+input.title:''}`;
    case 'update_entity': return 'Aktualisiert Eintrag';
    case 'complete_task': return input.done===false ? 'Öffnet Aufgabe' : 'Erledigt Aufgabe';
    case 'log_metric': return 'Erfasst Messwert';
    case 'delete_entity': return 'Löscht Eintrag';
    case 'save_memory': return 'Merkt sich Erkenntnis';
    case 'log_workout': return 'Protokolliert Training';
    default: return name;
  }
}

async function sendMessage(userText){
  if(!userText.trim()) return;
  state.chat.push({role:'user', content:userText.trim()});
  safeSet('aria-chat', state.chat);
  renderChat();
  document.getElementById('chatInput').value='';
  autoGrow();

  const messagesEl = document.getElementById('messages');
  const chipsEl = document.createElement('div');
  chipsEl.className = 'tool-chips';
  const typingEl = document.createElement('div');
  typingEl.className='typing';
  typingEl.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><span>NOVA analysiert…</span>';
  messagesEl.appendChild(chipsEl);
  messagesEl.appendChild(typingEl);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  document.getElementById('sendBtn').disabled = true;

  // Arbeitskopie für diese Runde: nur User/Assistant-Text wird dauerhaft
  // gespeichert (renderChat bleibt simpel); Tool-Use-Blöcke leben nur lokal
  // innerhalb dieser einzelnen Anfrage-Antwort-Runde.
  let working = state.chat.map(m=>({role:m.role, content:m.content}));

  try{
    let finalText = null;
    for(let round=0; round<6 && finalText===null; round++){
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system: SYSTEM_PERSONA + "\n\n" + buildContextSummary() + "\n\n" + buildMemorySummary(),
          tools: AI_TOOLS,
          messages: working
        })
      });
      const data = await response.json();
      const blocks = data.content || [];
      const toolUses = blocks.filter(b=>b.type==='tool_use');
      const text = blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();

      if(!toolUses.length){ finalText = text || 'Entschuldige, ich konnte gerade keine Antwort erzeugen.'; break; }

      working.push({ role:'assistant', content: blocks });
      const toolResults = [];
      for(const tu of toolUses){
        const chip = document.createElement('span');
        chip.className = 'tool-chip pending';
        chip.innerHTML = svg('bolt') + `<span>${esc(toolChipLabel(tu.name, tu.input))}</span>`;
        chipsEl.appendChild(chip);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        let payload;
        try{ payload = await executeTool(tu.name, tu.input); }
        catch(err){ payload = { error:String(err) }; }
        chip.classList.remove('pending');
        chip.classList.add('done-pulse');
        setTimeout(()=>chip.classList.remove('done-pulse'), 550);
        toolResults.push({ type:'tool_result', tool_use_id: tu.id, content: JSON.stringify(payload) });
      }
      working.push({ role:'user', content: toolResults });
    }
    typingEl.remove();
    state.chat.push({role:'assistant', content: finalText});
    safeSet('aria-chat', state.chat);
    renderChat();
    speakText(finalText);
  }catch(err){
    typingEl.remove();
    chipsEl.remove();
    toast('NOVA ist gerade nicht erreichbar');
    console.error(err);
  }finally{
    document.getElementById('sendBtn').disabled = false;
  }
}
document.getElementById('sendBtn').addEventListener('click', ()=>sendMessage(document.getElementById('chatInput').value));
document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(document.getElementById('chatInput').value); }
});

/* ============ SPRACHEIN-/AUSGABE (Web Speech API, browsereigen) ============ */
function speakText(text){
  if(!state.settings.sound) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'de-DE'; utter.rate = 1.02; utter.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const deVoice = voices.find(v=>v.lang && v.lang.startsWith('de'));
  if(deVoice) utter.voice = deVoice;
  window.speechSynthesis.speak(utter);
}

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, isListening = false;
if(SpeechRecognitionImpl){
  recognizer = new SpeechRecognitionImpl();
  recognizer.lang = 'de-DE';
  recognizer.interimResults = true;
  recognizer.continuous = false;
  recognizer.onresult = (e)=>{
    let transcript = '';
    for(let i=0;i<e.results.length;i++) transcript += e.results[i][0].transcript;
    document.getElementById('chatInput').value = transcript;
    autoGrow();
    if(e.results[e.results.length-1].isFinal){
      stopListening();
      if(transcript.trim()) sendMessage(transcript);
    }
  };
  recognizer.onerror = ()=>{ stopListening(); };
  recognizer.onend = ()=>{ stopListening(); };
}
function startListening(){
  if(!recognizer) { toast('Spracheingabe wird von diesem Browser nicht unterstützt'); return; }
  isListening = true;
  document.getElementById('micBtn').classList.add('listening');
  try{ recognizer.start(); }catch(e){}
}
function stopListening(){
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
}
document.getElementById('micBtn').addEventListener('click', ()=>{
  if(isListening) stopListening(); else startListening();
});
function autoGrow(){
  const ta = document.getElementById('chatInput'); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px';
}
document.getElementById('chatInput').addEventListener('input', autoGrow);
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>sendMessage(c.dataset.prompt)));

function startNewChat(){
  state.chat = []; safeSet('aria-chat', state.chat); renderChat(); toast('Neue Unterhaltung gestartet');
}
document.getElementById('fab').addEventListener('click', startNewChat);

/* ============ INIT ============ */
async function initApp(){
  try{
    await loadState();
  }catch(err){
    console.error('loadState fehlgeschlagen', err);
  }
  showMainView('dashboard');
}
initApp();

/* ============ SERVICE WORKER (Phase 3: PWA) ============
   Registriert sich selbst nur, wenn der Browser das grundsätzlich erlaubt.
   In der Claude-Artefakt-Vorschau (Iframe) lehnen die meisten Browser die
   Registrierung ab — das ist normal und kein Fehler, NOVA läuft trotzdem
   ganz normal weiter, nur eben ohne Offline-Vorteil, bis die Datei auf
   einer echten Origin gehostet wird. */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.info('Service Worker nicht registrierbar (z.B. Iframe-Vorschau) — kein Problem, NOVA läuft trotzdem:', err.message));
  });
}
</script>
